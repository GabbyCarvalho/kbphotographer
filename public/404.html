<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting...</title>
    <script>
      var path = window.location.pathname + window.location.search + window.location.hash;
      // Usar ?p= para bater com a verificação no seu main.jsx
      window.location.replace(
        window.location.origin + "/kbphotographer/?p=" + encodeURIComponent(path)
      );
    </script>
  </head>
  <body></body>
</html>
